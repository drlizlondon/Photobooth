<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Photo Booth" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Photo Booth</title>
</head>
<body>
<main id="app">

<section id="welcome" class="screen active">
  <button id="openSettings" class="settings-link">SETTINGS</button>
  <div class="welcome-inner">
    <p class="eyebrow">PHOTO BOOTH</p>
    <h1 id="welcomeTitle">Rae's 26th Birthday</h1>
    <p id="welcomeSubtitle" class="subcopy">2026</p>
    <button id="startBtn" class="round-start">
      <span>START</span>
      <small>tap to begin</small>
    </button>
    <p class="privacy">Nothing is uploaded. Photos stay on this device unless you share or save them.</p>
  </div>
</section>

<section id="camera" class="screen dark">
  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas" hidden></canvas>
    <div class="camera-shade"></div>
    <div class="camera-top">
      <span id="shotLabel">PHOTO 1 / 3</span>
      <button id="cancelCapture" class="plain-btn">CANCEL</button>
    </div>
    <div id="promptText" class="prompt-text"></div>
    <div id="countdown" class="countdown"></div>
    <div id="flash" class="flash"></div>
  </div>
</section>

<section id="review" class="screen review-screen">
  <div class="review-grid">
    <div class="hero-preview">
      <canvas id="mainCanvas"></canvas>
    </div>

    <aside class="review-controls">
      <p class="eyebrow">YOUR CREATION</p>
      <h2 id="reviewHeading">Your strip</h2>

      <div class="version-tabs" id="versionTabs">
        <button class="version-tab active" data-mode="strip">Strip</button>
        <button class="version-tab" data-mode="magazine">Magazine</button>
        <button class="version-tab" data-mode="polaroid">Polaroid</button>
        <button class="version-tab" data-mode="grid">Grid</button>
        <button class="version-tab" data-mode="story">Story</button>
      </div>

      <div id="stripPanel" class="mode-panel active">
        <label class="panel-label">Strip style</label>
        <div id="stripStyles" class="choice-row"></div>

        <label class="panel-label">Filter</label>
        <div id="filters" class="choice-row"></div>
      </div>

      <div id="magazinePanel" class="mode-panel">
        <label class="panel-label">Choose cover photo</label>
        <div id="photoPicker" class="photo-picker"></div>
      </div>

      <div class="primary-actions">
        <button id="shareBtn" class="primary-btn">Share</button>
        <button id="saveBtn" class="secondary-btn">Save</button>
      </div>

      <button id="nextGuestBtn" class="next-btn">Next guest →</button>
      <button id="retakeBtn" class="retake-btn">Retake photos</button>
      <p class="timeout-note">This screen resets after 2 minutes of inactivity.</p>
    </aside>
  </div>
</section>

<section id="timeout" class="screen timeout-screen">
  <div>
    <p class="eyebrow">SESSION COMPLETE</p>
    <h2>Thank you ♡</h2>
  </div>
</section>

<section id="settings" class="screen settings-screen">
  <div class="settings-panel">
    <div class="settings-head">
      <div>
        <p class="eyebrow">ADMIN</p>
        <h2>Event settings</h2>
      </div>
      <button id="closeSettings" class="close-btn">×</button>
    </div>

    <div class="settings-grid">
      <label>Event title<input id="setTitle" type="text" maxlength="50"></label>
      <label>Year / date<input id="setYear" type="text" maxlength="30"></label>
      <label>Strip footer<input id="setStripFooter" type="text" maxlength="60"></label>

      <label>Event design
        <select id="setTheme">
          <option value="luxury">Luxury</option>
          <option value="editorial">Editorial</option>
          <option value="romantic">Romantic</option>
          <option value="party">Party</option>
        </select>
      </label>

      <label>Magazine masthead<input id="setMagazineMasthead" type="text" maxlength="30"></label>
      <label>Magazine line 1<input id="setMagazineCaption1" type="text" maxlength="44"></label>
      <label>Magazine line 2<input id="setMagazineCaption2" type="text" maxlength="44"></label>
      <label>Magazine line 3<input id="setMagazineCaption3" type="text" maxlength="44"></label>

      <label>Polaroid caption<input id="setPolaroidCaption" type="text" maxlength="60"></label>
      <label>Grid caption<input id="setGridCaption" type="text" maxlength="60"></label>
      <label>Story caption<input id="setStoryCaption" type="text" maxlength="60"></label>

      <label>Accent colour<input id="setAccent" type="color"></label>

      <label>Countdown
        <select id="setCountdown">
          <option value="3">3 seconds</option>
          <option value="5">5 seconds</option>
        </select>
      </label>

      <label class="toggle"><input id="setMirror" type="checkbox"><span>Mirror selfie camera</span></label>
      <label class="toggle"><input id="setPrompts" type="checkbox"><span>Group prompts</span></label>
      <label class="toggle"><input id="setShutter" type="checkbox"><span>Shutter sound</span></label>
      <label class="toggle"><input id="setFlash" type="checkbox"><span>Flash effect</span></label>
      <label class="toggle"><input id="setMagazineEnabled" type="checkbox"><span>Enable Magazine</span></label>
      <label class="toggle"><input id="setPolaroidEnabled" type="checkbox"><span>Enable Polaroid</span></label>
      <label class="toggle"><input id="setGridEnabled" type="checkbox"><span>Enable Grid</span></label>
      <label class="toggle"><input id="setStoryEnabled" type="checkbox"><span>Enable Story</span></label>
    </div>

    <div class="settings-actions">
      <button id="resetSettings" class="retake-btn">Reset defaults</button>
      <button id="saveSettings" class="primary-btn">Save settings</button>
    </div>
  </div>
</section>

</main>
<script src="app.js"></script>
</body>
</html>
