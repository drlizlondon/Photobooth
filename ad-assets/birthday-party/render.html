<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyBishBash birthday Magazine render</title>
  <style>
    body { margin: 0; background: #0b0b0b; color: #fff; font: 16px system-ui, sans-serif; }
    main { width: min(720px, 100vw); margin: 0 auto; padding: 24px; box-sizing: border-box; }
    canvas { display: block; width: 100%; height: auto; background: #000; }
    #status { margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="magazineOutput"></canvas>
    <p id="status">Rendering…</p>
  </main>

  <script src="../../fonts.js"></script>
  <script src="../../covers.js"></script>
  <script src="../../product.js"></script>
  <script src="../../event.js"></script>
  <script>
    (function () {
      "use strict";

      const Event = window.MyBishBashEvent;
      const Product = window.MyBishBashProduct;
      const theme = Event.resolveTheme("after-dark");
      const settings = Event.createEventConfig({
        schemaVersion: Event.EVENT_CONFIG_SCHEMA_VERSION,
        eventId: "ad-mayas-23rd-birthday",
        eventType: "birthday",
        eventTitle: "Maya's 23rd Birthday",
        location: "London",
        eventLine: "The night we all got in the photo.",
        date: "12.08.26",
        datePrecision: "exact",
        themeId: theme.id,
        magazineTemplate: theme.magazineTemplate,
        coverSkyline1: "THE BIRTHDAY EDIT",
        coverSkyline2: "MAYA'S 23RD · 12.08.26",
        coverSkyline3: "AFTER DARK",
        coverF1Title: "EVERYONE IN",
        coverF1Dek: "The night we all made the frame.",
        coverF2Title: "ONE MORE PHOTO",
        coverF2Dek: "Nobody kept a straight face.",
        coverBig: "TWENTY THREE",
        coverBigDek: "The night worth keeping.",
        coverFooter: "FRIENDS · LAUGHS · ONE FINAL SHOT"
      });
      const policy = Product.getOutputBrandingPolicy(Product.ENTITLEMENTS.ONE_EVENT);
      const branding = {
        mode: policy.mode,
        text: policy.myBishBashText,
        brandName: "",
        primaryColor: theme.primary,
        secondaryColor: theme.highlight,
        logoImage: null
      };

      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("Could not load " + url));
          image.src = url;
        });
      }

      async function main() {
        const status = document.getElementById("status");
        try {
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          const photos = await Promise.all([
            "generated/birthday-selfie-1-warm.png",
            "generated/birthday-selfie-2-warm.png",
            "generated/birthday-selfie-3-warm.png"
          ].map(loadImage));
          await Promise.all(photos.map(image => image.decode ? image.decode().catch(() => {}) : null));

          const canvas = document.getElementById("magazineOutput");
          const size = window.Covers.coverSize("portrait", 1200);
          canvas.width = size.width;
          canvas.height = size.height;
          window.Covers.render(canvas.getContext("2d"), {
            img: photos[2],
            fonts: window.Fonts.faces(settings),
            width: size.width,
            height: size.height,
            copy: window.Covers.copyFor(settings),
            accent: theme.primary,
            accentInk: Event.safeForeground(theme.primary),
            template: settings.magazineTemplate,
            edition: { no: 1 },
            branding
          });

          window.__birthdayMagazine = {
            dataUrl: canvas.toDataURL("image/png"),
            theme: theme.id,
            template: settings.magazineTemplate,
            selectedPhoto: 3
          };
          status.textContent = "READY";
          document.body.dataset.ready = "true";
        } catch (error) {
          status.textContent = error.stack || error.message || String(error);
          document.body.dataset.ready = "error";
        }
      }

      main();
    }());
  </script>
</body>
</html>
